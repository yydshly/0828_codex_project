<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">DAIZHIGE CAPABILITY ATLAS</title>
  <desc id="desc">已归档的古籍候选资料源能力图，相关产品出现时按需启用</desc>
  <rect width="1280" height="720" fill="#08100d"/>
  <circle cx="1080" cy="92" r="270" fill="#7fe0c2" opacity=".055"/>
  <circle cx="166" cy="654" r="230" fill="#d9c8a7" opacity=".035"/>
  <g fill="none" stroke="#29423a">
    <path d="M72 112h1136M72 616h1136"/>
    <path d="M316 168v378M642 168v378M968 168v378" stroke-dasharray="5 9"/>
  </g>
  <text x="72" y="79" fill="#7fe0c2" font-family="ui-monospace,Consolas,monospace" font-size="18" font-weight="700" letter-spacing="4">PROJECT 004 · REFERENCE CORPUS · ARCHIVED</text>
  <text x="72" y="151" fill="#f2f5f3" font-family="Inter,Arial,sans-serif" font-size="52" font-weight="680" letter-spacing="-2">DAIZHIGE CAPABILITY ATLAS</text>
  <g font-family="ui-monospace,Consolas,monospace">
    <g transform="translate(72 202)">
      <text fill="#9eaaa5" font-size="14" letter-spacing="2">01 / RAW ARCHIVE</text>
      <rect y="30" width="212" height="274" fill="#101715" stroke="#36544b"/>
      <g font-size="16" font-weight="700">
        <rect x="20" y="55" width="172" height="28" fill="#173029"/><text x="34" y="75" fill="#aaf2dc">佛藏  5,135</text>
        <rect x="20" y="91" width="172" height="28" fill="#152720"/><text x="34" y="111" fill="#d9c8a7">史藏  2,043</text>
        <rect x="20" y="127" width="172" height="28" fill="#14231e"/><text x="34" y="147" fill="#d9c8a7">集藏  1,948</text>
        <rect x="20" y="163" width="172" height="28" fill="#13201c"/><text x="34" y="183" fill="#d9c8a7">道藏  1,721</text>
        <rect x="20" y="199" width="172" height="28" fill="#121d19"/><text x="34" y="219" fill="#d9c8a7">＋ 6 门类</text>
      </g>
      <text x="20" y="267" fill="#7fe0c2" font-size="14">15,694 TXT</text>
      <text x="20" y="288" fill="#82908a" font-size="13">4.79 GiB · 10 collections</text>
    </g>
    <g transform="translate(398 202)">
      <text fill="#9eaaa5" font-size="14" letter-spacing="2">02 / STRUCTURE</text>
      <rect y="30" width="212" height="274" fill="#101715" stroke="#2b3b36"/>
      <g fill="#dfe8e4" font-size="17" font-weight="700">
        <text x="24" y="78">PATH</text><text x="24" y="127">FILENAME</text><text x="24" y="176">TXT BODY</text><text x="24" y="225">GIT SHA</text>
      </g>
      <g stroke="#49675e"><path d="M24 94h164M24 143h164M24 192h164"/></g>
      <text x="24" y="272" fill="#7fe0c2" font-size="14">FILESYSTEM = INDEX</text>
      <text x="24" y="291" fill="#82908a" font-size="13">分类 · 书名 · 正文 · 快照</text>
    </g>
    <g transform="translate(724 202)">
      <text fill="#9eaaa5" font-size="14" letter-spacing="2">03 / IF TRIGGERED</text>
      <rect y="30" width="212" height="274" fill="#10251f" stroke="#4b7468"/>
      <g fill="#aaf2dc" font-size="15" font-weight="700">
        <text x="24" y="73">SOURCE + QUALITY</text>
        <text x="24" y="113">STABLE STRUCTURE</text>
        <text x="24" y="153">HYBRID RETRIEVAL</text>
        <text x="24" y="193">CITATION CONTRACT</text>
        <text x="24" y="233">EVALUATION</text>
      </g>
      <text x="24" y="272" fill="#d9c8a7" font-size="14">CORPUS → EVIDENCE</text>
      <text x="24" y="291" fill="#82908a" font-size="13">不是把 TXT 直接交给模型</text>
    </g>
    <g transform="translate(1050 202)">
      <text fill="#9eaaa5" font-size="14" letter-spacing="2">04 / USE WHEN RELEVANT</text>
      <rect y="30" width="158" height="274" fill="#101715" stroke="#2b3b36"/>
      <g fill="#dfe8e4" font-size="15" font-weight="700">
        <text x="22" y="79">SEARCH</text><text x="22" y="120">RAG</text><text x="22" y="161">DH LAB</text><text x="22" y="202">TEACHING</text><text x="22" y="243">GRAPH</text>
      </g>
      <text x="22" y="280" fill="#7fe0c2" font-size="13">VERIFIABLE</text>
    </g>
    <g fill="#557168" font-size="26"><text x="345" y="359">→</text><text x="671" y="359">→</text><text x="997" y="359">→</text></g>
  </g>
  <text x="72" y="664" fill="#9eaaa5" font-family="Inter,Arial,sans-serif" font-size="20">现在归档；遇到古籍相关产品，再把它作为候选资料源重新评估。</text>
  <text x="1208" y="664" fill="#7fe0c2" font-family="ui-monospace,Consolas,monospace" font-size="16" text-anchor="end">NO MIRROR · ON DEMAND</text>
</svg>
