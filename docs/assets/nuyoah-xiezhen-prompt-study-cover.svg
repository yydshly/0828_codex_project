<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Prompt as Production System</title>
  <desc id="desc">用户输入经过摄影提示词控制层连接现有图片模型的系统示意</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071012"/>
      <stop offset="1" stop-color="#10191d"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#67e7e1" stroke-opacity=".08"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <path d="M72 70h100v6H78v94h-6zM1528 830h-100v-6h94v-94h6z" fill="#f6d653"/>
  <text x="76" y="108" fill="#67e7e1" font-family="monospace" font-size="24" font-weight="700" letter-spacing="4">PROJECT 005 / VISUAL SKILL ENGINEERING</text>
  <text x="76" y="228" fill="#eff7f7" font-family="Arial, sans-serif" font-size="112" font-weight="800" letter-spacing="-7">PROMPT AS</text>
  <text x="76" y="332" fill="#eff7f7" font-family="Arial, sans-serif" font-size="112" font-weight="800" letter-spacing="-7">PRODUCTION SYSTEM</text>
  <text x="80" y="390" fill="#91a3a7" font-family="Arial, sans-serif" font-size="28">提示词没有消失，它被工程化了。</text>
  <g transform="translate(80 510)">
    <rect width="380" height="190" fill="#0b1113" stroke="#31484e"/>
    <text x="26" y="40" fill="#67e7e1" font-family="monospace" font-size="18">01 / INPUT</text>
    <text x="26" y="120" fill="#edf5f5" font-family="Arial, sans-serif" font-size="38" font-weight="700">主题 + 参考图</text>
    <text x="26" y="158" fill="#91a3a7" font-family="Arial, sans-serif" font-size="20">用户意图与身份职责</text>
    <path d="M400 95h88" stroke="#52686d" stroke-width="3"/>
    <path d="m480 84 12 11-12 11" fill="none" stroke="#52686d" stroke-width="3"/>
  </g>
  <g transform="translate(580 510)">
    <rect width="430" height="190" fill="#102224" stroke="#67e7e1" stroke-width="3"/>
    <text x="26" y="40" fill="#67e7e1" font-family="monospace" font-size="18">02 / CONTROL LAYER</text>
    <text x="26" y="120" fill="#edf5f5" font-family="Arial, sans-serif" font-size="38" font-weight="700">摄影规则编译</text>
    <text x="26" y="158" fill="#91a3a7" font-family="Arial, sans-serif" font-size="20">路由 · 拓扑 · 门禁 · 重做</text>
    <path d="M450 95h88" stroke="#52686d" stroke-width="3"/>
    <path d="m530 84 12 11-12 11" fill="none" stroke="#52686d" stroke-width="3"/>
  </g>
  <g transform="translate(1120 510)">
    <rect width="400" height="190" fill="#0b1113" stroke="#f6d653" stroke-opacity=".75"/>
    <text x="26" y="40" fill="#f6d653" font-family="monospace" font-size="18">03 / EXTERNAL MODEL</text>
    <text x="26" y="120" fill="#edf5f5" font-family="Arial, sans-serif" font-size="38" font-weight="700">现有图片模型</text>
    <text x="26" y="158" fill="#91a3a7" font-family="Arial, sans-serif" font-size="20">能力上限仍由模型决定</text>
  </g>
  <text x="80" y="810" fill="#f6d653" font-family="monospace" font-size="22" font-weight="700" letter-spacing="3">SKILL ≠ IMAGE MODEL</text>
  <text x="1520" y="810" fill="#67e7e1" font-family="monospace" font-size="22" text-anchor="end">v1.1.0 / 7482a14</text>
</svg>
