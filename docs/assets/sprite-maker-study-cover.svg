  <g transform="translate(68 650)" font-family="ui-monospace,Consolas,monospace" font-size="18" font-weight="700">
    <rect width="18" height="18" fill="#e8a75b"/><text x="30" y="16" fill="#c2d1c9">AI CREATION</text>
    <rect x="196" width="18" height="18" fill="#8ff0b5"/><text x="226" y="16" fill="#c2d1c9">DETERMINISTIC ENGINE</text>
    <rect x="516" width="18" height="18" fill="#5ca7ff"/><text x="546" y="16" fill="#c2d1c9">OWNED ARTIFACTS</text>
  </g>
</svg>
